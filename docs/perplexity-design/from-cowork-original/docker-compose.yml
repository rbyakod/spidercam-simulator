services:
  backend:
    build: ./backend
    container_name: spiderpi-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/app/data
      - ./profiles:/app/profiles
    environment:
      - PYTHONUNBUFFERED=1
      - SPIDERPI_SIM_GPIO=1

  frontend:
    build: ./frontend
    container_name: spiderpi-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_WS_URL=ws://localhost:8000/ws
    depends_on:
      - backend
